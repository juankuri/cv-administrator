<div class="experience-section">
  <div class="exp-list card">
    <h2>Experiencias Laborales</h2>
    <div *ngFor="let job of workExperience; let i = index" class="exp-item">
      <div class="exp-header" (click)="toggleExperience(i)">
        <div class="exp-summary">
          <span class="exp-position">{{ job.position || 'Puesto' }}</span>
          <span class="exp-company">{{ job.company || 'Empresa' }}</span>
        </div>
        <span class="toggle-icon">{{ isExpExperienced[i] ? '▼' : '►' }}</span>
      </div>
      <div class="exp-details" [class.expanded]="isExpExperienced[i]">
        <div class="input-group">
          <label for="job-position-{{i}}">Puesto</label>
          <input type="text" id="job-position-{{i}}" class="txt" [(ngModel)]="job.position" placeholder="Puesto">
        </div>
        <div class="input-group">
          <label for="job-company-{{i}}">Empresa</label>
          <input type="text" id="job-company-{{i}}" class="txt" [(ngModel)]="job.company" placeholder="Empresa">
        </div>
        <div class="input-group">
          <label for="job-start-{{i}}">Inicio</label>
          <input type="text" id="job-start-{{i}}" class="txt" [(ngModel)]="job.starDate" placeholder="mm/yyyy">
        </div>
        <div class="input-group">
          <label for="job-end-{{i}}">Fin</label>
          <input type="text" id="job-end-{{i}}" class="txt" [(ngModel)]="job.endDate" placeholder="mm/yyyy">
        </div>
        <div class="input-group">
          <label for="job-location-{{i}}">Ubicación</label>
          <input type="text" id="job-location-{{i}}" class="txt" [(ngModel)]="job.location" placeholder="Ciudad, País">
        </div>
        <div class="input-group">
          <label for="job-accomplishments-{{i}}">Logros</label>
          <input type="text" id="job-accomplishments-{{i}}" class="txt" [(ngModel)]="job.accomplishments" placeholder="Logros">
        </div>
        <div class="button-group">
          <button class="btn delete" (click)="deleteJob(job.id)">Eliminar</button>
          <button class="btn update" (click)="actualizarWorkExperience(job.id!)">Actualizar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="exp-form card">
    <h2>Agregar</h2>
    <form (ngSubmit)="AgregarJob()">
      <div class="input-group">
        <label for="new-job-position">Puesto</label>
        <input type="text" id="new-job-position" class="txt" [(ngModel)]="myWorkExperience.position" name="position" placeholder="Puesto">
      </div>
      <div class="input-group">
        <label for="new-job-company">Empresa</label>
        <input type="text" id="new-job-company" class="txt" [(ngModel)]="myWorkExperience.company" name="company" placeholder="Empresa">
      </div>
      <div class="input-group">
        <label for="new-job-start">Inicio</label>
        <input type="text" id="new-job-start" class="txt" [(ngModel)]="myWorkExperience.starDate" name="startDate" placeholder="mm/yyyy">
      </div>
      <div class="input-group">
        <label for="new-job-end">Fin</label>
        <input type="text" id="new-job-end" class="txt" [(ngModel)]="myWorkExperience.endDate" name="endDate" placeholder="mm/yyyy">
      </div>
      <div class="input-group">
        <label for="new-job-location">Ubicación</label>
        <input type="text" id="new-job-location" class="txt" [(ngModel)]="myWorkExperience.location" name="location" placeholder="Ciudad, País">
      </div>
      <div class="input-group">
        <label for="new-job-accomplishments">Logros</label>
        <input type="text" id="new-job-accomplishments" class="txt" [(ngModel)]="myWorkExperience.accomplishments" name="accomplishments" placeholder="Logros">
      </div>
      <button type="submit" class="btn submit">{{ btntxt }}</button>
    </form>
  </div>
</div>
