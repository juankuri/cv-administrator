<div class="interest-section">
  <h2>Intereses</h2>

  <div class="card">
    <h3>Agregar Interés</h3>
    <form (ngSubmit)="AregarInterest()">
      <div class="input-group">
        <label for="interest">Interés</label>
        <input
          type="text"
          id="interest"
          class="txt"
          name="title" 
          placeholder="Escribe aquí"
          [(ngModel)]="myInterests.title" />
      </div>

      <div class="input-group">
        <label for="description">Descripción</label> 
        <textarea
          id="description"
          class="txt textarea"
          name="description" 
          placeholder="Escribe aquí"
          [(ngModel)]="myInterests.description">
        </textarea>
      </div>

      <div class="input-group">
        <label for="icon">Icono</label> 
        <input
          type="text"
          id="icon"
          class="txt"
          name="icon" 
          placeholder="Clase del icono"
          [(ngModel)]="myInterests.icon" />
      </div>

      <button type="submit" class="btn">Guardar</button>
    </form>
  </div>

  <div class="card">
    <h3>Tus intereses</h3>
    <div *ngFor="let interest of interests; let i = index" class="interest-item">
      <div class="interest-card">
        <div class="interest-content">
        <div class="interest-icon">{{ interest.icon }}</div>
        <div class="input-group">
            <label for="interest-title-{{i}}">Interés</label>
            <input 
              type="text" 
              id="interest-title-{{i}}" 
              class="txt" 
              [(ngModel)]="interest.title" 
              placeholder="Interés">
          </div>
          <div class="input-group">
            <label for="interest-desc-{{i}}">Descripción</label>
            <textarea 
              id="interest-desc-{{i}}" 
              class="txt textarea" 
              [(ngModel)]="interest.description" 
              placeholder="Descripción">
            </textarea>
          </div>
          <div class="input-group">
            <label for="interest-icon-{{i}}">Icono</label>
            <input 
              type="text" 
              id="interest-icon-{{i}}" 
              class="txt" 
              [(ngModel)]="interest.icon" 
              placeholder="Clase del icono">
          </div>
        </div>
      </div>
      <div class="button-group">
        <button type="button" class="btn danger" (click)="deleteInterest(interest.id)">Borrar</button>
        <button type="button" class="btn update" (click)="actualizarInterest(interest.id!)">Actualizar</button>
      </div>
    </div>
  </div>
</div>
