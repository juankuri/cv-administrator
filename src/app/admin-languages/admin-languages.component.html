<div class="language-section">
  <div class="language-form card">
    <h2>Nuevo Idioma</h2>
    <form (ngSubmit)="agregarLanguage()">
      <div class="input-group">
        <label for="language-name">Idioma</label>
        <input type="text" id="language-name" class="txt" name="name"
               placeholder="Nombre del idioma" [(ngModel)]="myLanguage.name" />
      </div>
      <div class="input-group">
        <label for="language-level">Nivel (%)</label>
        <input type="number" id="language-level" class="txt" name="level"
               placeholder="Nivel del 1 al 100" [(ngModel)]="myLanguage.level" />
      </div>
      <button type="submit" class="btn submit">Agregar</button>
    </form>
  </div>

  <div class="language-list card">
    <h2>Tus Idiomas</h2>
    <div *ngFor="let language of languages; let i = index"
         class="language-item" [class.expanded]="isExpanded[i]">
      <div class="language-header" (click)="toggleLanguage(i)">
        <div class="language-summary">
          <span class="language-name">{{language.name}}</span>
          <span class="language-level">{{language.level}}%</span>
        </div>
        <span class="toggle-icon">{{isExpanded[i] ? '▲' : '▼'}}</span>
      </div>
      <div class="language-details">
        <div class="input-group">
          <label for="lang-name-{{i}}">Idioma</label>
          <input type="text" id="lang-name-{{i}}" class="txt"
                 [(ngModel)]="language.name" name="name-{{i}}" />
        </div>
        <div class="input-group">
          <label for="lang-level-{{i}}">Nivel (%)</label>
          <input type="number" id="lang-level-{{i}}" class="txt"
                 [(ngModel)]="language.level" name="level-{{i}}" />
        </div>
        <div class="button-group">
          <button class="btn delete" (click)="deleteLanguage(language.id)">Eliminar</button>
          <button class="btn update" (click)="actualizarLanguage(language.id!)">Actualizar</button>
        </div>
      </div>
    </div>
  </div>
</div>
